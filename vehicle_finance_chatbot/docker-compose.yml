services:
  api:
    build: .
    image: vehicle-finance-chatbot:latest
    ports:
      - "8080:8080"
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:8000/v1}"
      LLM_API_KEY: "${LLM_API_KEY:-local-dev-key}"
      LLM_MODEL: "${LLM_MODEL:-Qwen2.5-72B-Instruct-AWQ}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-hash}"
      VECTORSTORE: "${VECTORSTORE:-faiss}"
      QDRANT_URL: "http://qdrant:6333"
      DATABASE_URL: "sqlite:///./data/vehicle_finance.db"
      PII_LOG_MASKING: "true"
      AUDIT_LOG_PATH: "./data/audit.log"
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

